[project]
name = "nettskjema-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Nettskjema API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.5.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
nettskjema-mcp = "server:mcp"
